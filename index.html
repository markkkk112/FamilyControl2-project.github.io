<!DOCTYPE html>
<html lang="uk" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#f2f2f7" id="tc">
<title>Конституція хати</title>
<script>try{document.documentElement.setAttribute('data-theme',matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch(e){}</script>
<style>
:root{
  --bg:#f2f2f7;--card:#fff;--ink:#000;--mute:#8e8e93;--sep:rgba(60,60,67,.2);--press:#e5e5ea;--seg:#e3e3e8;--thumb:#fff;--navbg:rgba(242,242,247,.82);--tabbg:rgba(255,255,255,.74);
  --blue:#007aff;--pink:#ff2d55;--green:#34c759;--orange:#ff9500;--indigo:#5856d6;--teal:#30b0c7;--red:#ff3b30;--gray:#8e8e93;
  --accent:var(--blue);color-scheme:light}
:root[data-theme="dark"]{
  --bg:#000;--card:#1c1c1e;--ink:#fff;--mute:#98989f;--sep:rgba(84,84,88,.65);--press:#2c2c2e;--seg:#1c1c1e;--thumb:#636366;--navbg:rgba(0,0,0,.72);--tabbg:rgba(44,44,46,.72);
  --blue:#0a84ff;--pink:#ff375f;--green:#30d158;--orange:#ff9f0a;--indigo:#5e5ce6;--teal:#40c8e0;--red:#ff453a;
  color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html.theming *,html.theming *::before,html.theming *::after{transition:background-color .45s,color .45s,border-color .45s,box-shadow .45s,stroke .45s,fill .45s!important}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
button{font-family:inherit}
svg{display:block}
.row,.tabs,.wd,.pu,.mc{-webkit-user-select:none;user-select:none}
body::before{content:"";position:fixed;left:0;right:0;top:0;height:340px;background:radial-gradient(60% 100% at 50% 0,color-mix(in srgb,var(--accent) 12%,transparent),transparent);pointer-events:none;z-index:-1;transition:background .5s}

/* ========== screens (welcome + picker) ========== */
.screen{position:fixed;inset:0;z-index:100;overflow:hidden;opacity:0;visibility:hidden;pointer-events:none;transform:scale(1.05);filter:blur(16px);
  transition:opacity .6s ease,transform .8s cubic-bezier(.2,.8,.2,1),filter .6s ease,visibility 0s .8s}
.screen.on{opacity:1;visibility:visible;pointer-events:auto;transform:none;filter:none;transition-delay:0s}

/* welcome */
.welcome{background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 24px) 24px calc(env(safe-area-inset-bottom,0px) + 34px)}
.welcome::before{content:"";position:absolute;inset:-25%;pointer-events:none;filter:blur(40px);animation:drift 16s ease-in-out infinite alternate;
  background:radial-gradient(38% 30% at 22% 22%,color-mix(in srgb,var(--pink) 26%,transparent),transparent 72%),radial-gradient(38% 30% at 82% 30%,color-mix(in srgb,var(--blue) 26%,transparent),transparent 72%),radial-gradient(46% 34% at 55% 88%,color-mix(in srgb,var(--orange) 22%,transparent),transparent 72%),radial-gradient(34% 28% at 12% 78%,color-mix(in srgb,var(--indigo) 20%,transparent),transparent 72%)}
@keyframes drift{from{transform:translate(-3%,-2%) scale(1)}to{transform:translate(3%,3%) scale(1.12)}}
.w-center{position:relative;flex:1;display:grid;place-items:center;width:100%;text-align:center}
.hello{display:inline-block;padding:.08em .18em .16em;font-size:clamp(58px,17vw,112px);font-weight:700;line-height:1.1;letter-spacing:-.025em;white-space:nowrap;
  background:linear-gradient(100deg,#ff9f0a 0%,#ff375f 32%,#bf5af2 62%,#0a84ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
  -webkit-mask-image:linear-gradient(90deg,#000 40%,transparent 60%);mask-image:linear-gradient(90deg,#000 40%,transparent 60%);
  -webkit-mask-size:250% 100%;mask-size:250% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:100% 0;mask-position:100% 0}
.hello.in{animation:wipe 1.25s cubic-bezier(.55,0,.25,1) both}
.hello.out{animation:hout .52s ease both}
@keyframes wipe{from{-webkit-mask-position:100% 0;mask-position:100% 0}to{-webkit-mask-position:0 0;mask-position:0 0}}
@keyframes hout{from{-webkit-mask-position:0 0;mask-position:0 0;opacity:1;filter:blur(0)}to{-webkit-mask-position:0 0;mask-position:0 0;opacity:0;filter:blur(14px);transform:scale(1.05)}}
.w-bottom{position:relative;width:100%;max-width:420px;text-align:center}
.w-bottom h2{margin:0 0 4px;font-size:22px;font-weight:700;letter-spacing:.2px}
.w-bottom p{margin:0 0 22px;color:var(--mute);font-size:15px}
.cta{display:block;width:100%;height:54px;border:0;border-radius:15px;background:var(--blue);color:#fff;font-size:17px;font-weight:600;cursor:pointer;box-shadow:0 12px 24px -10px color-mix(in srgb,var(--blue) 80%,transparent);transition:transform .25s cubic-bezier(.3,1.4,.5,1),filter .2s}
.cta:active{transform:scale(.97);filter:brightness(.92)}
.welcome.on .w-bottom{animation:rise .9s 1.5s cubic-bezier(.2,.9,.3,1) backwards}
@keyframes rise{from{opacity:0;transform:translateY(24px)}}

/* picker (macOS-style) */
.picker{background:#08080f;color:#fff;display:flex;flex-direction:column;--u:clamp(78px,24vw,112px)}
.wall{position:absolute;inset:0;overflow:hidden}
.wall i{position:absolute;border-radius:50%;filter:blur(80px);opacity:.8;will-change:transform}
.wall .b1{width:75vmax;height:75vmax;left:-30vmax;top:-34vmax;background:#1f6bff;animation:f1 24s ease-in-out infinite alternate}
.wall .b2{width:65vmax;height:65vmax;right:-30vmax;top:6vh;background:#a73bff;animation:f2 28s ease-in-out infinite alternate}
.wall .b3{width:60vmax;height:60vmax;left:0;bottom:-36vmax;background:#ff3b6b;animation:f3 26s ease-in-out infinite alternate}
.wall .b4{width:40vmax;height:40vmax;right:5vmax;bottom:-18vmax;background:#19c3d6;opacity:.55;animation:f1 30s ease-in-out infinite alternate-reverse}
.wall::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 40%,rgba(0,0,0,0),rgba(0,0,0,.42))}
@keyframes f1{to{transform:translate(22vmax,14vmax) scale(1.18)}}
@keyframes f2{to{transform:translate(-20vmax,16vmax) scale(.9)}}
@keyframes f3{to{transform:translate(18vmax,-14vmax) scale(1.2)}}
.p-top{position:relative;text-align:center;padding-top:calc(env(safe-area-inset-top,0px) + 8vh)}
.p-time{font-size:clamp(66px,18vw,108px);font-weight:600;line-height:1;letter-spacing:-.035em;font-variant-numeric:tabular-nums;text-shadow:0 4px 30px rgba(0,0,0,.25)}
.p-date{margin-top:8px;font-size:clamp(17px,4.6vw,22px);font-weight:600;opacity:.85}
.picker.on .p-top{animation:down .9s .1s cubic-bezier(.2,.9,.3,1) backwards}
@keyframes down{from{opacity:0;transform:translateY(-18px)}}
.p-users{position:relative;flex:1;display:flex;align-items:center;justify-content:center;padding:0 8px}
.pu{flex:none;width:calc(var(--u) + 22px);display:flex;flex-direction:column;align-items:center;gap:14px;padding:0;border:0;background:none;color:#fff;cursor:pointer;outline:none;
  transition:width .65s cubic-bezier(.2,.8,.2,1),opacity .45s,transform .65s cubic-bezier(.2,.8,.2,1),filter .45s}
.picker.on .pu{animation:puin .85s cubic-bezier(.2,.9,.3,1) backwards;animation-delay:calc(.2s + var(--i) * .1s)}
@keyframes puin{from{opacity:0;transform:translateY(28px) scale(.8);filter:blur(10px)}}
.pav{position:relative;display:block;width:var(--u);height:var(--u);border-radius:50%;box-shadow:0 18px 40px -10px rgba(0,0,0,.55);transition:transform .45s cubic-bezier(.3,1.4,.5,1),box-shadow .3s}
.pav .av2{width:100%;height:100%;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.28)}
.pav::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:3px solid transparent;border-top-color:#fff;border-right-color:rgba(255,255,255,.35);opacity:0;transition:opacity .3s}
@media (hover:hover){.pu:hover .pav{transform:scale(1.07);box-shadow:0 22px 46px -10px rgba(0,0,0,.6),0 0 0 4px rgba(255,255,255,.18)}}
.pu:active .pav{transform:scale(.96)}
.pu:focus-visible .pav{box-shadow:0 0 0 4px #fff,0 18px 40px -10px rgba(0,0,0,.55)}
.pn{font-size:19px;font-weight:600;white-space:nowrap;text-shadow:0 1px 10px rgba(0,0,0,.4)}
.ps{height:0;margin-top:-10px;font-size:14px;opacity:0;white-space:nowrap;transition:opacity .4s .2s}
.pu.sel .pav{transform:scale(1.14)}
.pu.sel .pav::after{opacity:1;animation:spin .9s linear infinite}
.pu.sel .ps{opacity:.8}
.pu.dim{width:0;opacity:0;transform:scale(.7);filter:blur(10px)}
.picker.busy{pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.p-hint{position:relative;text-align:center;font-size:14px;opacity:.6;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 30px);transition:opacity .4s}
.picker.busy .p-hint{opacity:0}

/* ========== avatars ========== */
.av2{display:block;flex:none;width:var(--s,30px);height:var(--s,30px);border-radius:50%;overflow:hidden;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.3)}
.av2 svg{width:100%;height:100%}
.g-parents{background:linear-gradient(160deg,color-mix(in srgb,var(--indigo) 60%,#fff),var(--indigo))}
.g-mark{background:linear-gradient(160deg,color-mix(in srgb,var(--blue) 58%,#fff),var(--blue))}
.g-margo{background:linear-gradient(160deg,color-mix(in srgb,var(--pink) 58%,#fff),var(--pink))}
.av2+.av2{margin-left:-12px;box-shadow:0 0 0 2px var(--bg)}

/* ========== app shell ========== */
.app{display:none}
.app.on{display:block;animation:appin .8s cubic-bezier(.2,.9,.3,1) both}
.app.leaving{animation:appout .32s ease both}
@keyframes appin{from{opacity:0;transform:translateY(22px) scale(.985);filter:blur(8px)}}
@keyframes appout{to{opacity:0;transform:scale(.97);filter:blur(8px)}}
.nav{position:sticky;top:0;z-index:10;min-height:calc(52px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 12px 0;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  background:var(--navbg);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid transparent;transition:border-color .3s}
.nt{grid-column:2;font-weight:600;opacity:0;transform:translateY(6px);transition:opacity .3s,transform .3s;white-space:nowrap}
.nav.s{border-color:var(--sep)}.nav.s .nt{opacity:1;transform:none}
.chip{grid-column:3;justify-self:end;display:flex;align-items:center;gap:8px;padding:3px 13px 3px 3px;border:0;border-radius:99px;background:color-mix(in srgb,var(--card) 85%,transparent);box-shadow:0 0 0 .5px var(--sep);color:var(--ink);font-size:14px;font-weight:600;cursor:pointer;transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.chip:active{transform:scale(.94)}
main{max-width:600px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(130px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
h1{margin:4px 0 2px;font-size:34px;line-height:1.12;font-weight:700;letter-spacing:.35px}
.sub{margin:0;color:var(--mute);font-size:15px}
.pane{animation:pane .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes pane{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* tab bar */
.tabs{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:20;width:min(calc(100% - 24px),440px);transform:translateX(-50%);display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:5px;border-radius:27px;
  background:var(--tabbg);-webkit-backdrop-filter:saturate(180%) blur(26px);backdrop-filter:saturate(180%) blur(26px);box-shadow:0 14px 34px -10px rgba(0,0,0,.32),0 0 0 .5px var(--sep)}
.app.on .tabs{animation:tabin .8s .25s cubic-bezier(.2,.9,.3,1) backwards}
@keyframes tabin{from{transform:translate(-50%,140%)}}
.tabs button{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;border:0;background:none;color:var(--mute);font-size:10.5px;font-weight:600;cursor:pointer;transition:color .3s}
.tabs button svg{width:24px;height:24px;transition:transform .5s cubic-bezier(.3,1.7,.5,1)}
.tabs button.on{color:var(--accent)}
.tabs button.on svg{transform:translateY(-1px) scale(1.1)}
.tabs button:active svg{transform:scale(.88)}
.tab-i{position:absolute;top:5px;bottom:5px;left:0;width:0;border-radius:22px;background:color-mix(in srgb,var(--accent) 14%,transparent);transition:transform .5s cubic-bezier(.3,1.15,.4,1),width .3s,background .4s}

/* segmented */
.seg{position:relative;display:grid;grid-template-columns:repeat(3,1fr);margin:20px 0 4px;padding:2px;border-radius:9px;background:var(--seg)}
.seg button{position:relative;z-index:1;padding:7px 0;border:0;background:none;color:var(--ink);font-size:13px;font-weight:600;cursor:pointer}
.thumb{position:absolute;top:2px;bottom:2px;left:0;width:0;border-radius:7px;background:var(--thumb);box-shadow:0 3px 8px rgba(0,0,0,.12),0 1px 1px rgba(0,0,0,.05);transition:transform .45s cubic-bezier(.3,1.15,.4,1),width .3s}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);margin:14px 0 0}
.wd{position:relative;display:flex;align-items:center;justify-content:center;height:46px;padding:0;border:0;background:none;color:var(--mute);cursor:pointer;animation:in .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 45ms)}
.wd i{position:relative;font-style:normal;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:600;color:var(--ink);background:var(--card);transition:background .3s,color .3s,transform .25s}
.wd .rg{position:absolute;left:50%;top:50%;margin:-22px 0 0 -22px;pointer-events:none}
.wd.today i{color:var(--accent)}
.wd.sel i{background:var(--accent);color:#fff;box-shadow:0 8px 16px -6px color-mix(in srgb,var(--accent) 70%,transparent);animation:pop .45s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:scale(.78)}to{transform:scale(1)}}
.wd:active i{transform:scale(.9)}

/* rings */
.rg .trk{fill:none;stroke:color-mix(in srgb,var(--mute) 24%,transparent)}
.rg .prg{fill:none;stroke:var(--accent);stroke-linecap:round;opacity:0;transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1),stroke .4s,opacity .25s}
.full .prg{stroke:var(--green)}
.past .prg{stroke:var(--orange)}

/* cards, rows */
.sh{display:flex;align-items:center;gap:10px;margin:24px 16px 8px;font-size:13px;text-transform:uppercase;letter-spacing:.02em;color:var(--mute)}
.sh.big{margin-top:28px;font-size:22px;font-weight:700;text-transform:none;letter-spacing:0;color:var(--ink)}
.sh.big .tr{margin-left:auto}
.card{background:var(--card);border-radius:14px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04),0 10px 28px -14px rgba(0,0,0,.14)}
.row{position:relative;display:flex;align-items:center;gap:14px;min-height:60px;padding:11px 16px;transition:background .2s;animation:in .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 55ms)}
.row:active{background:var(--press)}
.row+.row::before{content:"";position:absolute;top:0;left:66px;right:0;height:.5px;background:var(--sep)}
.tile{flex:none;position:relative;width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:#fff;box-shadow:0 1px 2px rgba(0,0,0,.14);transition:filter .4s,opacity .4s}
.tile::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,0) 60%);pointer-events:none}
.tile svg{width:20px;height:20px}
.tx{flex:1;min-width:0}
.tx b{display:block;font-weight:500;line-height:1.25;transition:color .3s}
.tx small{display:block;margin-top:1px;color:var(--mute);font-size:13px;line-height:1.3}
.tr{font-size:14px;font-weight:600;white-space:nowrap;padding:4px 11px;border-radius:99px;background:var(--pbg,transparent)}
.m{color:var(--blue);--pbg:color-mix(in srgb,var(--blue) 14%,transparent)}.r{color:var(--pink);--pbg:color-mix(in srgb,var(--pink) 14%,transparent)}.both{color:var(--green);--pbg:color-mix(in srgb,var(--green) 15%,transparent)}.turn{color:var(--orange);--pbg:color-mix(in srgb,var(--orange) 16%,transparent)}
.ok{color:var(--green);--pbg:color-mix(in srgb,var(--green) 15%,transparent)}.wait{color:var(--mute);--pbg:color-mix(in srgb,var(--mute) 16%,transparent)}.miss{color:var(--red);--pbg:color-mix(in srgb,var(--red) 14%,transparent)}
.dh{display:flex;align-items:center;gap:8px;margin:26px 16px 12px}
.dh h2{margin:0;font-size:26px;line-height:1.1;font-weight:700;letter-spacing:.3px}
.bd{font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px}
.bd.b{background:var(--accent);color:#fff}
.bd.o{background:color-mix(in srgb,var(--orange) 16%,transparent);color:var(--orange)}
.now{display:flex;align-items:center;gap:14px;margin:0 0 12px;padding:14px 16px;border-radius:14px;background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.04),0 10px 28px -14px rgba(0,0,0,.14);animation:in .6s cubic-bezier(.2,.8,.2,1) both}
.now .tx small{margin:0 0 2px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.bal{padding:16px}
.bl{display:flex;gap:3px;height:10px}
.bl i{display:block;border-radius:5px;transform-origin:left;animation:grow .9s .2s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}}
.lg{display:flex;justify-content:space-between;gap:8px;margin-top:12px;font-size:13px;color:var(--mute)}
.lg u{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;text-decoration:none}

/* checkbox */
.cb{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid color-mix(in srgb,var(--mute) 55%,transparent);display:grid;place-items:center;transition:background .3s,border-color .3s,transform .3s}
.cb svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .38s .08s cubic-bezier(.65,0,.35,1)}
.task.done .cb,.th.on .cb{background:var(--accent);border-color:var(--accent);animation:cbpop .45s cubic-bezier(.3,1.6,.5,1)}
.task.done .cb svg,.th.on .cb svg{stroke-dashoffset:0}
@keyframes cbpop{40%{transform:scale(1.22)}}
.task{cursor:pointer}
.task.done .tx b{color:var(--mute)}
.task.done .tile{filter:saturate(.35);opacity:.6}
.task.lock{cursor:default}.task.lock .tile{opacity:.55}.task.lock .tx b{color:var(--mute)}
.lk{flex:none;width:28px;height:28px;display:grid;place-items:center;color:var(--mute)}
.lk svg{width:18px;height:18px}
.task.shake .tx,.task.shake .lk{animation:shake .42s}
@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.tg{font-size:11px;font-weight:600;color:var(--accent);padding:2px 8px;border-radius:99px;background:color-mix(in srgb,var(--accent) 13%,transparent);white-space:nowrap}

/* hero */
.hero{margin:16px 0 0;padding:18px;border-radius:20px;background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.04),0 14px 34px -16px rgba(0,0,0,.2);animation:in .6s cubic-bezier(.2,.8,.2,1) both}
.hero.pulse{animation:pulse .7s cubic-bezier(.3,1.4,.5,1)}
@keyframes pulse{40%{transform:scale(1.03)}}
.hero-t{display:flex;align-items:center;gap:18px}
.bigr{position:relative;width:92px;height:92px;flex:none}
.bc{position:absolute;inset:0;display:grid;place-items:center}
.bc b{font-size:21px;font-weight:700;letter-spacing:-.3px;font-variant-numeric:tabular-nums;transition:opacity .3s,transform .45s cubic-bezier(.3,1.5,.5,1)}
.bc svg{position:absolute;width:38px;height:38px;fill:none;stroke:var(--green);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:scale(.4);transition:opacity .3s,transform .5s cubic-bezier(.3,1.6,.5,1)}
.full .bc b{opacity:0;transform:scale(.6)}
.full .bc svg{opacity:1;transform:none}
.hx{min-width:0}
.hx small{display:block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}

}

  else t='22:00 уже минуло';
  return '<div class="now" style="margin-top:20px">'+tile('clock','indigo')+'<div class="tx"><small>Зараз</small><b>'+t+'</b></div></div>';
}

/* ---------- sync: Firebase Realtime Database over REST & GitHub Pages ---------- */
var SYNC={url:'',ok:null,at:0,pending:{},timer:null,first:false,busy:false};
function normUrl(u){u=(u||'').trim().replace(/\.json.*$/,'').replace(/\/+$/,'');return /^(https:\/\/|http:\/\/(localhost|127\.0\.0\.1)[:\/])\S+$/.test(u)||/^https:\/\/\S+$/.test(u)?u:''}

(function(){
  var raw = location.hash || location.search || '';
  var m = raw.match(/[#&?]db=([^&]+)/), fresh = false;
  if(m){
    try {
      var u = normUrl(decodeURIComponent(m[1]));
      if(u){ lset('hata.sync', u); fresh = true; }
    } catch(e){}
    try {
      var clean = location.pathname;
      if(location.search && !location.search.match(/^[?&]db=/)) clean += location.search;
      history.replaceState(null, '', clean);
    } catch(e){}
  }
  SYNC.url = normUrl(lget('hata.sync')) || normUrl(CONFIG_DB);
  SYNC.first = fresh;
})();

function sUrl(p){return SYNC.url+'/hata/'+p+'.json'}
function sig(o){return Object.keys(o).sort().map(function(k){return k+'='+o[k]}).join(',')}
function sSend(k,v){
  if(!SYNC.url)return Promise.resolve();
  return fetch(sUrl('done/'+encodeURIComponent(k)),{method:v===null?'DELETE':'PUT',body:v===null?undefined:JSON.stringify(v)})
    .then(function(r){if(!r.ok)throw 0;if(SYNC.pending[k]===v)delete SYNC.pending[k]})
    .catch(function(){SYNC.ok=false});
}
function sPush(k,v){if(!SYNC.url)return;SYNC.pending[k]=v;sSend(k,v)}
function sClear(){if(!SYNC.url)return;SYNC.pending={};fetch(sUrl('done'),{method:'DELETE'}).catch(function(){SYNC.ok=false})}
function sPull(){
  if(!SYNC.url||SYNC.busy)return;SYNC.busy=true;
  Object.keys(SYNC.pending).forEach(function(k){sSend(k,SYNC.pending[k])});
  return fetch(sUrl('done'),{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(m){
    var k,out={},before=sig(ST.done);
    m=(m&&typeof m==='object')?m:{};
    for(k in m)if(typeof m[k]==='number')out[k]=m[k];
    if(SYNC.first){for(k in ST.done)if(!(k in out)&&!(k in SYNC.pending)){out[k]=ST.done[k];sPush(k,ST.done[k])}SYNC.first=false}
    for(k in SYNC.pending){if(SYNC.pending[k]===null)delete out[k];else out[k]=SYNC.pending[k]}
    ST.done=out;SYNC.ok=true;SYNC.at=Date.now();SYNC.busy=false;
    if(sig(out)!==before){save();softRefresh();notifyLocal()}
  }).catch(function(){SYNC.busy=false;SYNC.ok=false});
}
function sStart(){clearInterval(SYNC.timer);if(!SYNC.url)return;sPull();SYNC.timer=setInterval(function(){if(!document.hidden&&S.user)sPull()},4000)}

/* ---------- scroll, sync & focus events ---------- */
var nav=$('nav');
function onScroll(){nav.classList.toggle('s',window.scrollY>44)}
addEventListener('scroll',onScroll,{passive:true});
function softRefresh(){if(!S.user)return;if(S.tab==='mine')refreshKid();else if(S.tab==='over'||S.tab==='act')renderTab(false)}
addEventListener('storage',function(e){if(e.key!==KEY||!S.user)return;ST=load();softRefresh()});
document.addEventListener('visibilitychange',function(){if(document.hidden||!S.user)return;ST=load();softRefresh();sPull()});
window.addEventListener('focus',function(){if(!S.user)return;ST=load();softRefresh();sPull()});

/* ---------- boot ---------- */
applyTheme('auto');
if(ST.welcomed)showPicker();else showWelcome();
})();
